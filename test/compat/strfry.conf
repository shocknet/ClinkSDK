##
## Minimal strfry config for ClinkSDK CI
## (prod-like defaults; CI-safe mapsize/nofiles; bind all interfaces for Docker)
##

# Absolute path — dockurr image WORKDIR is /app; relative ./ can miss a writable LMDB dir
db = "/app/strfry-db/"

dbParams {
    maxreaders = 64
    # Small mapsize for containers (prod uses 10TB)
    mapsize = 1073741824
    noReadAhead = true
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    # CLINK kinds 21001-21003 are ephemeral (20000-29999)
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # 0.0.0.0 so GitHub Actions service port mapping works
    bind = "0.0.0.0"
    port = 7777
    # Don't try to raise ulimit in CI
    nofiles = 0
    realIpHeader = ""

    auth {
        # CLINK clients do not perform NIP-42; recent strfry defaults this on
        enabled = false
        serviceUrl = ""
    }

    info {
        name = "clink-sdk-ci"
        description = "Local strfry for ClinkSDK compat tests"
        pubkey = ""
        contact = ""
        icon = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 50

    writePolicy {
        plugin = ""
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 1
        reqWorker = 1
        reqMonitor = 1
        negentropy = 1
    }

    negentropy {
        enabled = false
        maxSyncEvents = 1000000
    }
}
